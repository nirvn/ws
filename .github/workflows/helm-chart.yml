name: helm-chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - '.github/workflows/helm-chart.yml'

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Set up Helm
        uses: azure/setup-helm@v4

      -
        name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      -
        name: Package chart
        run: helm package chart

      -
        name: Push chart
        run: helm push ws-chart-*.tgz oci://ghcr.io/${{ github.repository_owner }}/ws
