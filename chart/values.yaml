# NOTE: this chart intentionally does not expose a replicaCount value.
# The app holds all group/device state in an in-process dict, so running
# more than one pod would silently shard users across replicas and break
# the broadcast model. The Deployment hard-codes replicas: 1 for this
# reason — do not add an HPA either.

image:
  repository: ghcr.io/nirvn/ws
  pullPolicy: IfNotPresent
  # -- Pin a specific tag in production (e.g. a git sha or release tag).
  # Falls back to .Chart.appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8001

# Production-sane defaults. Override per-environment if needed.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# TCP probes - the app speaks WebSocket only, not plain HTTP, so HTTP probes
# would never get a 200 back. A successful TCP connect is a fine signal of
# liveness/readiness for this server.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

# Restrictive by default. The container is a stock python:3.12-slim image
# and does not need to write to the root filesystem or run as root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  # -- WebSocket hint for nginx ingress. Most controllers handle the WS
  # upgrade automatically, but some need a longer read timeout for
  # long-lived connections.
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: ws.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: ws-tls
    #   hosts:
    #     - ws.example.com

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
